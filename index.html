<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0e17; }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e17);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x404060, 0.5));
        const light = new THREE.DirectionalLight(0xffeedd, 1.2);
        light.position.set(5, 8, 4);
        light.castShadow = true;
        scene.add(light);
        scene.add(new THREE.DirectionalLight(0x4488ff, 0.4));

        function makeTexture(color1, color2) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 256, 256);
            grad.addColorStop(0, color1);
            grad.addColorStop(0.5, color2);
            grad.addColorStop(1, '#fdcb6e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.2})`;
                ctx.beginPath();
                ctx.arc(Math.random()*256, Math.random()*256, Math.random()*3+1, 0, Math.PI*2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(c);
        }

        function makeChecker() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, 256, 256);
            for (let r = 0; r < 8; r++) {
                for (let col = 0; col < 8; col++) {
                    if ((r+col)%2===0) {
                        ctx.fillStyle = '#6c5ce7';
                    } else {
                        ctx.fillStyle = '#fd79a8';
                    }
                    ctx.fillRect(col*32, r*32, 32, 32);
                }
            }
            return new THREE.CanvasTexture(c);
        }

        const group = new THREE.Group();
        scene.add(group);

        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 1.2, 1.2),
            new THREE.MeshStandardMaterial({ map: makeTexture('#6c5ce7', '#fd79a8'), roughness: 0.3 })
        );
        cube.castShadow = true;
        cube.position.x = -1.5;
        group.add(cube);

        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.9, 32, 32),
            new THREE.MeshStandardMaterial({ map: makeChecker(), roughness: 0.4 })
        );
        sphere.castShadow = true;
        sphere.position.x = 1.5;
        group.add(sphere);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 10),
            new THREE.ShadowMaterial({ opacity: 0.3 })
        );
        ground.rotation.x = -Math.PI/2;
        ground.position.y = -0.9;
        ground.receiveShadow = true;
        scene.add(ground);

        const stars = new THREE.Points(
            new THREE.BufferGeometry().setFromPoints(
                Array.from({ length: 400 }, () => new THREE.Vector3(
                    (Math.random()-0.5)*60,
                    (Math.random()-0.5)*40,
                    (Math.random()-0.5)*60
                ))
            ),
            new THREE.PointsMaterial({ color: 0x8888ff, size: 0.08, transparent: true, opacity: 0.8 })
        );
        scene.add(stars);

        let dragging = false, px = 0, py = 0, rx = 0, ry = 0;

        renderer.domElement.addEventListener('mousedown', e => { dragging = true; px = e.clientX; py = e.clientY; });
        window.addEventListener('mouseup', () => dragging = false);
        window.addEventListener('mousemove', e => {
            if (!dragging) return;
            const dx = e.clientX - px, dy = e.clientY - py;
            ry += dx * 0.008;
            rx += dy * 0.008;
            rx = Math.max(-1.5, Math.min(1.5, rx));
            group.rotation.x = rx;
            group.rotation.y = ry;
            px = e.clientX; py = e.clientY;
        });

        renderer.domElement.addEventListener('touchstart', e => {
            const t = e.touches[0];
            px = t.clientX; py = t.clientY;
        }, { passive: true });
        renderer.domElement.addEventListener('touchmove', e => {
            const t = e.touches[0];
            const dx = t.clientX - px, dy = t.clientY - py;
            ry += dx * 0.008;
            rx += dy * 0.008;
            rx = Math.max(-1.5, Math.min(1.5, rx));
            group.rotation.x = rx;
            group.rotation.y = ry;
            px = t.clientX; py = t.clientY;
        }, { passive: true });

        function animate() {
            stars.rotation.y += 0.0003;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
